# Acceptance-test server. Pinned by digest — the same jellyfin 12.0.0 image the
# Deadfin parity gate uses — so "passes acceptance" always means the same thing.
#
# /config and /cache are named volumes, not bind mounts: Docker Desktop's
# VirtioFS intermittently races marker-file creation in freshly created host
# dirs and crashes jellyfin at boot. Only the media library is bound in.
services:
  server:
    image: jellyfin/jellyfin@sha256:2d1a69be5aa2695d0c2df90ebeb76bbcc6efc0a798cb09bfa65906680e1d785a
    ports:
      - '${HARNESS_PORT:-8097}:8096'
    volumes:
      - config:/config
      - cache:/cache
      - ./.state/media:/media:ro

  # A second, untouched server for the first-run setup test (setup.spec.ts).
  # It sits on an internal network only: libraries added through the wizard
  # keep internet metadata on, and the run must stay hermetic.
  fresh:
    image: jellyfin/jellyfin@sha256:2d1a69be5aa2695d0c2df90ebeb76bbcc6efc0a798cb09bfa65906680e1d785a
    networks: [sealed]
    volumes:
      - fresh-config:/config
      - fresh-cache:/cache
      - ./.state/media:/media:ro

  # Static front for the built app. This replaced `vite preview` on the host
  # when the browser moved into a container: the app has to be
  # reachable by a name that resolves on the compose network. It is a different
  # origin from `server`, so the cross-origin path this target exists to
  # exercise is unchanged. Started by accept.sh only after `npm run build`,
  # otherwise docker creates ./dist root-owned before the build can write it.
  web:
    image: nginx:1.29-alpine
    volumes:
      - ../../dist:/srv/app:ro
      - ./nginx-app.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [default, sealed]

  # The browser. Pinned to the same version as @playwright/test in package.json
  # — bump both together or Playwright rejects the image's browser bundle.
  # ipc: host is Playwright's own guidance; Chromium exhausts the default 64MB
  # /dev/shm and crashes tabs. Runs as the invoking user so screenshots and
  # traces written into the bind-mounted repo are not root-owned.
  #
  # network_mode joins the nginx container's network namespace so the app is
  # reachable at http://localhost. That is not cosmetic: the app calls
  # crypto.randomUUID, which — like all of WebCrypto — exists only in a SECURE
  # CONTEXT. Browsers grant that to https, to http://localhost, and to nothing
  # else. Served as http://web the login screen dies on "crypto.randomUUID is
  # not a function". Sharing the netns still resolves `server` over the compose
  # network, so the API stays a genuinely different origin.
  playwright:
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    profiles: ['test']
    ipc: host
    network_mode: 'service:web'
    user: '${HOST_UID:-0}:${HOST_GID:-0}'
    working_dir: /work
    environment:
      HOME: /tmp
      CI: '1'
      PW_BASE_URL: http://localhost
      HARNESS_SERVER: http://server:8096
      EVIDENCE_DIR: /work/e2e/evidence/jellyfin
      HARNESS_PRODUCT: Jellyfin
    volumes:
      - ../../:/work
    command: ['npx', 'playwright', 'test', '--config', 'e2e/playwright.config.ts']
    depends_on:
      - server
      - web

  playwright-setup:
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    profiles: ['test']
    ipc: host
    network_mode: 'service:web'
    user: '${HOST_UID:-0}:${HOST_GID:-0}'
    working_dir: /work
    environment:
      HOME: /tmp
      CI: '1'
      PW_SPEC: setup.spec.ts
      PW_BASE_URL: http://localhost
      HARNESS_SERVER: http://fresh:8096
      EVIDENCE_DIR: /work/e2e/evidence/jellyfin-setup
    volumes:
      - ../../:/work
    command: ['npx', 'playwright', 'test', '--config', 'e2e/playwright.config.ts']
    depends_on:
      - fresh
      - web

networks:
  default:
  sealed:
    internal: true

volumes:
  config:
  cache:
  fresh-config:
  fresh-cache:
