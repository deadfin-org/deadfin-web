# Static app front for the stock-jellyfin acceptance target. Serves the built
# SPA and nothing else — no API proxy. The API lives on a different origin (the
# jellyfin container), which is the cross-origin path this target exists to
# exercise. The deadfin target uses it for its cross-origin pass too.
server {
  listen 80;
  root /srv/app;
  absolute_redirect off;

  # Hash routes (#/item/…): the app is index.html and its assets, nothing else.
  location = / { try_files /index.html =404; }
  location /assets/ { try_files $uri =404; }
  location = /favicon.svg { try_files $uri =404; }
}
