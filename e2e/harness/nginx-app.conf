# Static app front for the stock-jellyfin acceptance target. Serves the built
# SPA and nothing else — no API proxy. The API lives on a different origin (the
# jellyfin container), which is the cross-origin path this target exists to
# exercise. The deadfin target uses it for its cross-origin pass too.
#
# The headers are the README's hardening, with the harness servers
# (server, fresh) added because the API is on another origin here. The
# suite fails on any CSP violation (e2e/fixtures.ts), so a passing run
# proves the app works under this policy.
server {
  listen 80;
  root /srv/app;
  absolute_redirect off;

  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob: http://server:8096 http://fresh:8096; media-src 'self' blob: http://server:8096 http://fresh:8096; connect-src 'self' http://server:8096 http://fresh:8096; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

  # Hash routes (#/item/…): the app is index.html and its assets, nothing else.
  location = / { try_files /index.html =404; }
  location /assets/ { try_files $uri =404; }
  location = /favicon.svg { try_files $uri =404; }
}
