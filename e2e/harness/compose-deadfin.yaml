# Deadfin acceptance target — the client as parity probe.
#
# Topology mirrors a production deployment: nginx serves the built app and
# proxies API paths to deadfin SAME-ORIGIN (also required because cross-origin
# is blocked by the Deadfin CORS parity gap). The stock-jellyfin target
# (compose.yaml) keeps its cross-origin path.
#
# Harness containers run as root to sidestep named-volume ownership; a
# production pod runs uid 65532. State is a named volume (VirtioFS bind mounts
# race marker/db creation on Docker Desktop — same lesson as the jellyfin
# harness).
services:
  server:
    image: ${DEADFIN_IMAGE:?set DEADFIN_IMAGE to the Deadfin server image under test}
    user: '0:0'
    command: ['--listen', '0.0.0.0:8096']
    environment:
      JELLYFIN_DATA_DIR: /state
    ports:
      - '${HARNESS_PORT:-8098}:8096'
    volumes:
      - dfstate:/state
      - ./.state/media:/media:ro

  web:
    image: nginx:1.29-alpine
    ports:
      - '${HARNESS_WEB_PORT:-8099}:80'
    volumes:
      - ../../dist:/srv/app:ro
      - ./nginx-deadfin.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server

  # The browser — same contract as the jellyfin target's playwright service.
  # network_mode joins the nginx netns so the app answers on
  # http://localhost: the app calls crypto.randomUUID, and WebCrypto exists only
  # in a secure context (https or http://localhost, nothing else). Here that
  # address is also the same origin as the API, which is this target's whole
  # point. Version must track @playwright/test in package.json.
  playwright:
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    profiles: ['test']
    ipc: host
    network_mode: 'service:web'
    user: '${HOST_UID:-0}:${HOST_GID:-0}'
    working_dir: /work
    environment:
      HOME: /tmp
      CI: '1'
      PW_BASE_URL: http://localhost
      HARNESS_SERVER: http://localhost
      EVIDENCE_DIR: /work/e2e/evidence/deadfin
    volumes:
      - ../../:/work
    command: ['npx', 'playwright', 'test', '--config', 'e2e/playwright.config.ts']
    depends_on:
      - web

  # Seeding sidecar (never long-running): deadfin's own gate tooling.
  tools:
    image: ${DEADFIN_TOOLS_IMAGE:?set DEADFIN_TOOLS_IMAGE to the Deadfin replay-tools image}
    profiles: ['seed']
    user: '0:0'
    entrypoint: ['/bin/true']
    volumes:
      - dfstate:/state
      - ./.state/media:/media:ro
      - ./.state/seed:/seed:ro

volumes:
  dfstate:
