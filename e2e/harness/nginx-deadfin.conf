# Same-origin front for the deadfin acceptance target: the SPA's few routes
# and static assets are served from dist; everything else is the API.
server {
  listen 80;
  root /srv/app;
  absolute_redirect off;

  # Hash routes (#/item/…): the app is index.html and its assets, nothing else.
  location = / { try_files /index.html =404; }
  location /assets/ { try_files $uri =404; }
  location = /favicon.svg { try_files $uri =404; }

  location / {
    proxy_pass http://server:8096;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_buffering off;
  }
}
